; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = p10_4x1

[esp8266_common]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
upload_speed = 512000
monitor_speed = 74880
extra_scripts = pre:renameFirmware.py, pre:tools/harden_webserver.py

monitor_filters = time, esp8266_exception_decoder

[env:p10_1x1]
extends = esp8266_common
build_flags = -DDISPLAYS_WIDE=1

[env:p10_2x1]
extends = esp8266_common
build_flags = -DDISPLAYS_WIDE=2

[env:p10_3x1]
extends = esp8266_common
build_flags = -DDISPLAYS_WIDE=3

[env:p10_4x1]
extends = esp8266_common
build_flags = -DDISPLAYS_WIDE=4

; Production profiles: same hardware, diagnostics disabled.
[env:p10_1x1_release]
extends = esp8266_common
build_flags = -DDISPLAYS_WIDE=1 -DDEBUG=0

[env:p10_2x1_release]
extends = esp8266_common
build_flags = -DDISPLAYS_WIDE=2 -DDEBUG=0

[env:p10_3x1_release]
extends = esp8266_common
build_flags = -DDISPLAYS_WIDE=3 -DDEBUG=0

[env:p10_4x1_release]
extends = esp8266_common
build_flags = -DDISPLAYS_WIDE=4 -DDEBUG=0
