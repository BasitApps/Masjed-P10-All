; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = p10_4x1

[esp8266_common]
platform = espressif8266
board = esp12e
framework = arduino
upload_speed = 512000
monitor_speed = 115200
check_tool = 
	cppcheck
	clangtidy
check_skip_packages = yes
check_flags = --enable=all
extra_scripts = pre:renameFirmware.py

monitor_filters = time, esp8266_exception_decoder

[env:p10_1x1]
extends = esp8266_common
build_flags = -DDISPLAYS_WIDE=1

[env:p10_2x1]
extends = esp8266_common
build_flags = -DDISPLAYS_WIDE=2

[env:p10_3x1]
extends = esp8266_common
build_flags = -DDISPLAYS_WIDE=3

[env:p10_4x1]
extends = esp8266_common
build_flags = -DDISPLAYS_WIDE=4

; Production profiles: same hardware, diagnostics disabled.
[env:p10_1x1_release]
extends = esp8266_common
build_flags = -DDISPLAYS_WIDE=1 -DDEBUG=0

[env:p10_2x1_release]
extends = esp8266_common
build_flags = -DDISPLAYS_WIDE=2 -DDEBUG=0

[env:p10_3x1_release]
extends = esp8266_common
build_flags = -DDISPLAYS_WIDE=3 -DDEBUG=0

[env:p10_4x1_release]
extends = esp8266_common
build_flags = -DDISPLAYS_WIDE=4 -DDEBUG=0

[env:native]
platform = native
platform_packages = toolchain-gccmingw32
build_flags = -std=c++17
check_tool = cppcheck
build_src_filter = +<ArabicShaper.cpp>
test_filter =
	test_shaper
	test_time_math
	test_card_scheduler
	test_prayer_method_config
test_build_src = true
